<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mqttchat</title>
<style>
  :root {
    --bg: #000; --text: #e6e6e6; --dim: #7a7a7a; --line: #2a2a2a;
    --chrome: #c0c0c0; --chrome-text: #000; --hi: #fff; --lo: #808080; --dark: #000;
    --warn: #ff6b5b; --ok: #5fdc7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.35 "Lucida Console", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  .app { height: 100%; display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; min-height: 0; }

  #log { flex: 1; overflow-y: auto; padding: 6px 8px; min-width: 0; }
  .msg { display: flex; gap: 8px; padding: 1px 0; align-items: baseline; }
  .msg:hover { background: #111; }
  .time { color: var(--dim); flex: none; }
  .who { flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nick { font-weight: bold; }
  .tag { color: var(--dim); font-size: 11px; margin-left: 4px; }
  .body { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note { color: var(--dim); padding: 1px 0; }
  .note::before { content: "~ "; }
  .note.err { color: var(--warn); }
  @media (max-width: 560px) {
    .msg { flex-wrap: wrap; gap: 0 8px; }
    .who { max-width: none; }
    .body { flex-basis: 100%; padding-left: 12px; }
  }

  #users {
    width: 190px; flex: none; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  @media (max-width: 700px) { #users { display: none; } }
  .uhead { color: var(--dim); padding: 6px 8px 4px; border-bottom: 1px solid var(--line); }
  #ulist { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .user { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 0; }
  #status { padding: 4px 8px; border-top: 1px solid var(--line); color: var(--warn); }
  #status.on { color: var(--ok); }
  #status::before { content: "\25CF  "; }

  /* Grey beveled bar and controls */
  .chrome {
    background: var(--chrome); color: var(--chrome-text);
    border-top: 2px solid var(--hi);
    font: 12px/1.2 Tahoma, "MS Sans Serif", Verdana, Arial, sans-serif;
  }
  .bar { display: flex; gap: 4px; padding: 4px; }
  #settings { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 6px; align-items: center; border-bottom: 1px solid var(--lo); }
  #settings[hidden] { display: none; }
  #settings label { display: flex; align-items: center; gap: 4px; }
  #settings .grow { flex: 1; min-width: 220px; }
  #settings .grow input { flex: 1; min-width: 0; }
  .me { flex-basis: 100%; }
  .me b { font-family: "Lucida Console", Menlo, Consolas, monospace; }

  input, button { font: inherit; color: inherit; }
  input[type=text], input[type=password] {
    background: #fff; color: #000; padding: 3px 4px; border: 2px solid;
    border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    box-shadow: inset 1px 1px 0 var(--dark); border-radius: 0; min-width: 0;
  }
  #text { flex: 1; font-family: "Lucida Console", Menlo, Consolas, monospace; }
  button {
    background: var(--chrome); padding: 3px 10px; border: 2px solid; border-radius: 0;
    border-color: var(--hi) var(--dark) var(--dark) var(--hi);
    box-shadow: inset -1px -1px 0 var(--lo); cursor: pointer; white-space: nowrap;
  }
  button:active:not(:disabled) {
    border-color: var(--dark) var(--hi) var(--hi) var(--dark);
    box-shadow: inset 1px 1px 0 var(--lo); padding: 4px 9px 2px 11px;
  }
  button:disabled { color: var(--lo); text-shadow: 1px 1px 0 var(--hi); cursor: default; }
  input:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  #nickbtn { max-width: 30%; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div id="log" aria-live="polite">
      <div class="note" id="empty">no messages yet on jnvanderz.github.io/mqttchat. say something.</div>
    </div>
    <aside id="users">
      <div class="uhead">seen here</div>
      <div id="ulist"></div>
      <div id="status">connecting…</div>
    </aside>
  </div>

  <div class="chrome">
    <div id="settings" hidden>
      <label>Nickname <input id="nick" type="text" maxlength="24" size="18" autocomplete="off" placeholder="anonymous"></label>
      <label class="grow">Identity (secret)
        <input id="identity" type="password" maxlength="200" autocomplete="off" spellcheck="false">
        <button id="show" type="button">Show</button>
        <button id="regen" type="button" title="Generate a new random identity">New</button>
      </label>
      <div class="me">Others see you as <b id="myid">…</b></div>
    </div>
    <form class="bar" id="form">
      <button id="nickbtn" type="button" title="Change nickname and identity" aria-expanded="false" aria-controls="settings">anonymous</button>
      <input id="text" type="text" maxlength="500" autocomplete="off" aria-label="Message">
      <button id="sendbtn" disabled>Send</button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
"use strict";

const TOPIC  = "jnvanderz.github.io/mqttchat";
const BROKER = "wss://test.mosquitto.org:8081";

// CRYPTO-BEGIN
// How identity works:
//   secret identity --SHA-256 with fixed salt--> Ed25519 private key --> public key
//   public key --SHA-256 with fixed salt--> the short public ID shown next to the nickname
// Every message is signed with the private key and carries the public key, so
// receivers can check that the sender really holds the secret behind that ID.
const SALT = TOPIC + "|identity-v1|";
const MAX_NICK = 24, MAX_TEXT = 500;
const enc = new TextEncoder();
const PKCS8_ED25519_PREFIX = Uint8Array.from(
  [0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x04,0x22,0x04,0x20]);

const b64 = bytes => btoa(String.fromCharCode(...bytes))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => Uint8Array.from(
  atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const sha256 = async bytes => new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));

async function publicId(pubB64) {
  return b64((await sha256(enc.encode(SALT + pubB64))).slice(0, 12));
}

async function deriveKeys(identity) {
  const seed = await sha256(enc.encode(SALT + identity));
  const pkcs8 = new Uint8Array(48);
  pkcs8.set(PKCS8_ED25519_PREFIX);
  pkcs8.set(seed, 16);
  const priv = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "Ed25519" }, true, ["sign"]);
  const pub = (await crypto.subtle.exportKey("jwk", priv)).x;
  return { priv, pub, id: await publicId(pub) };
}

const signedBytes = (n, t, m) => enc.encode(JSON.stringify([TOPIC, n, t, m]));

async function signMessage(keys, n, m) {
  const t = Date.now();
  const sig = await crypto.subtle.sign({ name: "Ed25519" }, keys.priv, signedBytes(n, t, m));
  return JSON.stringify({ n, k: keys.pub, t, m, s: b64(new Uint8Array(sig)) });
}

// Returns {n, t, m, s, id} if the payload is well formed and the signature is valid, else null.
async function verifyMessage(raw) {
  try {
    if (raw.length > 2000) return null;
    const { n, k, t, m, s } = JSON.parse(raw);
    if (typeof n !== "string" || typeof m !== "string" || typeof k !== "string" ||
        typeof s !== "string" || !Number.isSafeInteger(t)) return null;
    if (!n || n.length > MAX_NICK || !m || m.length > MAX_TEXT) return null;
    const key = await crypto.subtle.importKey("raw", unb64(k), { name: "Ed25519" }, false, ["verify"]);
    const ok = await crypto.subtle.verify({ name: "Ed25519" }, key, unb64(s), signedBytes(n, t, m));
    return ok ? { n, t, m, s, id: await publicId(k) } : null;
  } catch (e) {
    return null;
  }
}

function randomIdentity() {
  return b64(crypto.getRandomValues(new Uint8Array(24)));
}
// CRYPTO-END

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let keys = null;       // current derived keypair
let client = null;
let connected = false;
const seen = new Set(); // signatures already shown
const users = new Map(); // public ID -> row in the "seen here" list

function hue(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
const colorOf = id => `hsl(${hue(id)} 90% 65%)`;
const pad = n => String(n).padStart(2, "0");

function note(text, isError) {
  const d = document.createElement("div");
  d.className = "note" + (isError ? " err" : "");
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

// All remote content goes in through textContent, never innerHTML.
function showMessage(msg) {
  const log = $("log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  $("empty")?.remove();

  const d = new Date(msg.t);
  const row = document.createElement("div"); row.className = "msg";
  const time = document.createElement("span"); time.className = "time";
  time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  time.title = d.toLocaleString();
  const who = document.createElement("span"); who.className = "who";
  const nick = document.createElement("span"); nick.className = "nick";
  nick.textContent = msg.n; nick.style.color = colorOf(msg.id);
  const id = document.createElement("span"); id.className = "tag"; id.textContent = msg.id;
  id.title = "Public ID, derived from the sender's secret identity";
  who.append(nick, id);
  const body = document.createElement("span"); body.className = "body"; body.textContent = msg.m;

  row.append(time, who, body);
  log.appendChild(row);
  while (log.children.length > 300) log.firstChild.remove();
  if (stick) log.scrollTop = log.scrollHeight;

  let u = users.get(msg.id);
  if (!u) {
    u = document.createElement("div"); u.className = "user";
    u.style.color = colorOf(msg.id);
    users.set(msg.id, u);
    $("ulist").appendChild(u);
  }
  u.textContent = msg.n;
  u.title = msg.id;
}

function refreshSend() {
  $("sendbtn").disabled = !(connected && keys);
}
function refreshNick() {
  $("nickbtn").textContent = $("nick").value.trim() || "anonymous";
}

async function applyIdentity() {
  const identity = $("identity").value;
  store.set("mqttchat.identity", identity);
  keys = null; refreshSend();
  $("myid").textContent = "…";
  if (!identity) { $("myid").textContent = "(enter an identity)"; return; }
  const k = await deriveKeys(identity);
  if ($("identity").value !== identity) return; // changed while we were deriving
  keys = k;
  $("myid").textContent = k.id;
  refreshSend();
}

// Incoming messages are verified one at a time so they stay in order.
let queue = Promise.resolve();
function onMessage(topic, payload, packet) {
  if (topic !== TOPIC) return;
  const raw = payload.toString();
  queue = queue.then(async () => {
    const msg = await verifyMessage(raw);
    if (!msg || seen.has(msg.s)) return;
    // Drop live messages with a timestamp far from now: they are replays of old ones.
    // The retained message is allowed to be old; its signed time is displayed.
    if (!packet.retain && Math.abs(Date.now() - msg.t) > 10 * 60 * 1000) return;
    seen.add(msg.s);
    showMessage(msg);
  });
}

function connect() {
  client = mqtt.connect(BROKER, {
    clientId: "mqttchat_" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 15000,
  });
  client.on("connect", () => {
    connected = true;
    $("status").textContent = "connected"; $("status").className = "on";
    client.subscribe(TOPIC);
    refreshSend();
  });
  const down = text => () => {
    connected = false;
    $("status").textContent = text; $("status").className = "";
    refreshSend();
  };
  client.on("reconnect", down("reconnecting…"));
  client.on("close", down("disconnected"));
  client.on("error", down("connection error"));
  client.on("message", onMessage);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !keys || !connected) return;
  const nick = ($("nick").value.trim() || "anonymous").slice(0, MAX_NICK);
  $("text").value = "";
  const payload = await signMessage(keys, nick, text.slice(0, MAX_TEXT));
  // retain: the broker keeps this as the last message and shows it to newcomers.
  client.publish(TOPIC, payload, { qos: 1, retain: true });
  $("text").focus();
});

$("nickbtn").addEventListener("click", () => {
  const open = $("settings").hidden;
  $("settings").hidden = !open;
  $("nickbtn").setAttribute("aria-expanded", String(open));
  if (open) $("nick").focus(); else $("text").focus();
});
$("nick").addEventListener("input", () => { store.set("mqttchat.nick", $("nick").value); refreshNick(); });
$("nick").addEventListener("keydown", e => { if (e.key === "Enter") $("nickbtn").click(); });
$("identity").addEventListener("input", applyIdentity);
$("show").addEventListener("click", () => {
  const hidden = $("identity").type === "password";
  $("identity").type = hidden ? "text" : "password";
  $("show").textContent = hidden ? "Hide" : "Show";
});
$("regen").addEventListener("click", () => {
  if (!confirm("Replace your identity with a new random one? Your current public ID is lost unless you saved the old identity.")) return;
  $("identity").value = randomIdentity();
  applyIdentity();
});

(async function init() {
  $("nick").value = store.get("mqttchat.nick") || "";
  refreshNick();
  $("identity").value = store.get("mqttchat.identity") || randomIdentity();
  try {
    await applyIdentity();
  } catch (e) {
    note("this browser does not support Ed25519 in Web Crypto, so messages cannot be signed. try a current version of Chrome, Firefox, Edge or Safari.", true);
    return;
  }
  if (typeof mqtt === "undefined") {
    note("could not load the MQTT library from unpkg.com.", true);
    return;
  }
  if (!store.get("mqttchat.nick")) $("nickbtn").click();
  connect();
})();
</script>
</body>
</html>
