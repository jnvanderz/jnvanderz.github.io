<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mqttchat</title>
<style>
  @font-face {
    font-family: "Chat Mono"; font-display: swap;
    src: local("Tomo"),
         url("https://cdn.jsdelivr.net/npm/@fontsource/dejavu-mono@5.3.0/files/dejavu-mono-latin-700-normal.woff2") format("woff2");
  }
  :root {
    --bg: #272822; --text: #f8f8f2; --dim: #555; --line: #333;
    --chrome: #d4d0c8; --chrome-text: #000; --hi: #fff; --lo: #808080; --dark: #000;
    --warn: #ff6b5b; --ok: #5fdc7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 12px/13px "Chat Mono", "Lucida Console", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  .app { height: 100%; display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; min-height: 0; }

  /* Message list: grey time, short ID, right-aligned coloured nickname, then the text
     behind a thin divider. */
  #log { flex: 1; overflow-x: hidden; overflow-y: scroll; min-width: 0; -webkit-font-smoothing: none; }
  .msg { display: flex; align-items: flex-start; }
  .time { flex: none; padding: 0 5px; color: var(--dim); }
  .tag  { flex: none; padding-right: 5px; color: var(--dim); white-space: nowrap; }
  .nick { flex: none; width: 100px; padding: 0 5px; text-align: right;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { flex: 1; min-width: 0; padding: 0 5px; border-left: 1px solid var(--line);
          white-space: pre-wrap; word-break: break-word; }
  .msg.note .body { opacity: 0.7; }
  .msg.note.err .body { opacity: 1; color: var(--warn); }
  @media (max-width: 560px) { .tag { display: none; } }

  #users {
    width: 150px; flex: none; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  @media (max-width: 700px) { #users { display: none; } }
  .uhead { color: var(--dim); padding: 2px 5px; border-bottom: 1px solid var(--line); }
  #ulist { flex: 1; overflow-y: auto; padding: 0 5px; }
  .user { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user:hover { background: #494a44; }
  #status { padding: 2px 5px; border-top: 1px solid var(--line); color: var(--warn); }
  #status.on { color: var(--ok); }
  #status::before { content: "\25CF  "; }

  /* Grey beveled bar and controls */
  .chrome {
    background: var(--chrome); color: var(--chrome-text);
    border-top: 2px solid var(--hi);
    font: 12px/1.2 Tahoma, "MS Sans Serif", Verdana, Arial, sans-serif;
  }
  .bar { display: flex; gap: 4px; padding: 4px; }

  input, button { font: inherit; color: inherit; }
  input[type=text], input[type=password] {
    background: #fff; color: #000; padding: 3px 4px; border: 2px solid;
    border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    box-shadow: inset 1px 1px 0 var(--dark); border-radius: 0; min-width: 0;
  }
  #text { flex: 1; font-family: "Chat Mono", "Lucida Console", Menlo, Consolas, monospace; }
  button {
    background: var(--chrome); padding: 3px 10px; border: 2px solid; border-radius: 0;
    border-color: var(--hi) var(--dark) var(--dark) var(--hi);
    box-shadow: inset -1px -1px 0 var(--lo); cursor: pointer; white-space: nowrap;
  }
  button:active:not(:disabled) {
    border-color: var(--dark) var(--hi) var(--hi) var(--dark);
    box-shadow: inset 1px 1px 0 var(--lo); padding: 4px 9px 2px 11px;
  }
  button:disabled { color: var(--lo); text-shadow: 1px 1px 0 var(--hi); cursor: default; }
  input:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  /* Prompt dialog */
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  #overlay[hidden] { display: none; }
  .dialog {
    width: 372px; max-width: 100%; background: var(--chrome); color: #000; padding: 2px;
    border: 1px solid; border-color: var(--chrome) #404040 #404040 var(--chrome);
    box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo);
    font: 12px/1.2 Tahoma, "MS Sans Serif", Verdana, Arial, sans-serif;
  }
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 2px 2px 5px; color: #fff; font-weight: bold;
    background: #000080;
  }
  .titlebar button { padding: 0; width: 16px; height: 14px; line-height: 10px; font-size: 11px; font-weight: bold; color: #000; }
  .titlebar button:active:not(:disabled) { padding: 1px 0 0 1px; }
  .dbody { padding: 12px 12px 10px; }
  .dbody label { display: block; margin-bottom: 6px; }
  .dbody input { width: 100%; }
  .dbuttons { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .dbuttons button { width: 94px; padding: 4px 0; }
  .dbuttons button:active:not(:disabled) { padding: 5px 0 3px 2px; }
  #nickbtn { max-width: 30%; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div id="log" aria-live="polite">
    </div>
    <aside id="users">
      <div class="uhead">seen here</div>
      <div id="ulist"></div>
      <div id="status">connecting…</div>
    </aside>
  </div>

  <div class="chrome">
    <form class="bar" id="form">
      <button id="nickbtn" type="button" title="Change nickname">anonymous</button>
      <input id="text" type="text" maxlength="500" autocomplete="off" aria-label="Message">
      <button id="sendbtn" disabled>Send</button>
    </form>
  </div>
</div>

<div id="overlay" hidden>
  <form class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="titlebar">
      <span id="dtitle">Prompt</span>
      <button type="button" id="dclose" aria-label="Close">&#x2715;</button>
    </div>
    <div class="dbody">
      <label for="dinput">nickname ?</label>
      <input id="dinput" type="text" maxlength="24" autocomplete="off" spellcheck="false">
      <div class="dbuttons">
        <button id="dok">Ok</button>
        <button type="button" id="dcancel">Cancel</button>
      </div>
    </div>
  </form>
</div>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
"use strict";

const TOPIC  = "https://jnvanderz.github.io/mqttchat";
//const BROKER = "wss://test.mosquitto.org:8081";
//had to change the MQTT broker because that other one was being more restrictive on VPN's and such
const BROKER = "wss://broker.emqx.io:8084/mqtt";

const SALT = "jnvanderz.github.io/mqttchat|identity-v1|";
const MAX_NICK = 24, MAX_TEXT = 500;
const enc = new TextEncoder();
const PKCS8_ED25519_PREFIX = Uint8Array.from(
  [0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x04,0x22,0x04,0x20]);

const b64 = bytes => btoa(String.fromCharCode(...bytes))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => Uint8Array.from(
  atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const sha256 = async bytes => new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));

async function publicId(pubB64) {
  return b64((await sha256(enc.encode(SALT + pubB64))).slice(0, 12));
}

async function deriveKeys(identity) {
  const seed = await sha256(enc.encode(SALT + identity));
  const pkcs8 = new Uint8Array(48);
  pkcs8.set(PKCS8_ED25519_PREFIX);
  pkcs8.set(seed, 16);
  const priv = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "Ed25519" }, true, ["sign"]);
  const pub = (await crypto.subtle.exportKey("jwk", priv)).x;
  return { priv, pub, id: await publicId(pub) };
}

const signedBytes = (n, t, m) => enc.encode(JSON.stringify([TOPIC, n, t, m]));

async function signMessage(keys, n, m) {
  const t = Date.now();
  const sig = await crypto.subtle.sign({ name: "Ed25519" }, keys.priv, signedBytes(n, t, m));
  return JSON.stringify({ n, k: keys.pub, t, m, s: b64(new Uint8Array(sig)) });
}

// Returns {n, t, m, s, id} if the payload is well formed and the signature is valid, else null.
async function verifyMessage(raw) {
  try {
    if (raw.length > 2000) return null;
    const { n, k, t, m, s } = JSON.parse(raw);
    if (typeof n !== "string" || typeof m !== "string" || typeof k !== "string" ||
        typeof s !== "string" || !Number.isSafeInteger(t)) return null;
    if (!n || n.length > MAX_NICK || !m || m.length > MAX_TEXT) return null;
    const key = await crypto.subtle.importKey("raw", unb64(k), { name: "Ed25519" }, false, ["verify"]);
    const ok = await crypto.subtle.verify({ name: "Ed25519" }, key, unb64(s), signedBytes(n, t, m));
    return ok ? { n, t, m, s, id: await publicId(k) } : null;
  } catch (e) {
    return null;
  }
}

function randomIdentity() {
  return b64(crypto.getRandomValues(new Uint8Array(24)));
}
// CRYPTO-END

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let nickname = "";   // empty means "anonymous"
let keys = null;       // current derived keypair
let client = null;
let connected = false;
let welcomed = false;
const seen = new Set(); // signatures already shown
const users = new Map(); // public ID -> row in the "seen here" list

function hue(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
const colorOf = id => `hsl(${hue(id)} 90% 65%)`;
const pad = n => String(n).padStart(2, "0");

function row(t, idText, nickText, bodyText) {
  const d = new Date(t);
  const r = document.createElement("div"); r.className = "msg";
  const time = document.createElement("span"); time.className = "time";
  time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  time.title = d.toLocaleString();
  const id = document.createElement("span"); id.className = "tag"; id.textContent = idText;
  const nick = document.createElement("span"); nick.className = "nick"; nick.textContent = nickText;
  const body = document.createElement("span"); body.className = "body"; body.textContent = bodyText;
  r.append(time, id, nick, body);
  return { r, id, nick };
}

function append(r) {
  const log = $("log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.appendChild(r);
  while (log.children.length > 300) log.firstChild.remove();
  if (stick) log.scrollTop = log.scrollHeight;
}

function note(text, isError) {
  const { r } = row(Date.now(), "\u00a0".repeat(6), "~", text);
  r.className = "msg note" + (isError ? " err" : "");
  append(r);
}

// All remote content goes in through textContent, never innerHTML.
function showMessage(msg) {
  const { r, id, nick } = row(msg.t, msg.id.slice(0, 6), msg.n, msg.m);
  nick.style.color = colorOf(msg.id);
  id.title = nick.title = "Public ID: " + msg.id;
  append(r);

  let u = users.get(msg.id);
  if (!u) {
    u = document.createElement("div"); u.className = "user";
    u.style.color = colorOf(msg.id);
    users.set(msg.id, u);
    $("ulist").appendChild(u);
  }
  u.textContent = msg.n;
  u.title = msg.id;
}

function refreshSend() {
  $("sendbtn").disabled = !(connected && keys);
}
function refreshNick() {
  $("nickbtn").textContent = nickname || "anonymous";
}

// The secret identity is generated on the first visit and kept in this browser's
// localStorage, so the same public ID comes back on every later visit.
async function loadIdentity() {
  let identity = store.get("mqttchat.identity");
  if (!identity) {
    identity = randomIdentity();
    store.set("mqttchat.identity", identity);
  }
  keys = await deriveKeys(identity);
  $("nickbtn").title = "Change nickname (your ID: " + keys.id + ")";
  refreshSend();
}

// Incoming messages are verified one at a time so they stay in order.
let queue = Promise.resolve();
function onMessage(topic, payload, packet) {
  if (topic !== TOPIC) return;
  const raw = payload.toString();
  queue = queue.then(async () => {
    const msg = await verifyMessage(raw);
    if (!msg || seen.has(msg.s)) return;
    // Drop live messages with a timestamp far from now: they are replays of old ones.
    // The retained message is allowed to be old; its signed time is displayed.
    if (!packet.retain && Math.abs(Date.now() - msg.t) > 10 * 60 * 1000) return;
    seen.add(msg.s);
    showMessage(msg);
  });
}

function connect() {
  client = mqtt.connect(BROKER, {
    clientId: "mqttchat_" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 15000,
  });
  client.on("connect", () => {
    connected = true;
    $("status").textContent = "connected"; $("status").className = "on";
    if (!welcomed) { welcomed = true; note("connected to " + TOPIC + ". click your nickname to change it."); }
    client.subscribe(TOPIC);
    refreshSend();
  });
  const down = text => () => {
    connected = false;
    $("status").textContent = text; $("status").className = "";
    refreshSend();
  };
  client.on("reconnect", down("reconnecting…"));
  client.on("close", down("disconnected"));
  client.on("error", down("connection error"));
  client.on("message", onMessage);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !keys || !connected) return;
  const nick = nickname || "anonymous";
  $("text").value = "";
  const payload = await signMessage(keys, nick, text.slice(0, MAX_TEXT));
  // retain: the broker keeps this as the last message and shows it to newcomers.
  client.publish(TOPIC, payload, { qos: 1, retain: true });
  $("text").focus();
});

// Nickname dialog: Ok or Enter accepts; Cancel, Escape or the X leaves the name as it was.
function closeDialog(accept) {
  if (accept) {
    nickname = $("dinput").value.trim().slice(0, MAX_NICK);
    store.set("mqttchat.nick", nickname);
    refreshNick();
  }
  $("overlay").hidden = true;
  $("text").focus();
}
$("nickbtn").addEventListener("click", () => {
  $("dinput").value = nickname;
  $("overlay").hidden = false;
  $("dinput").focus();
  $("dinput").select();
});
$("dialog").addEventListener("submit", e => { e.preventDefault(); closeDialog(true); });
$("dcancel").addEventListener("click", () => closeDialog(false));
$("dclose").addEventListener("click", () => closeDialog(false));
$("overlay").addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(false); });

(async function init() {
  nickname = (store.get("mqttchat.nick") || "").trim().slice(0, MAX_NICK);
  refreshNick();
  try {
    await loadIdentity();
  } catch (e) {
    note("this browser does not support Ed25519 in Web Crypto, so messages cannot be signed. try a current version of Chrome, Firefox, Edge or Safari.", true);
    return;
  }
  if (typeof mqtt === "undefined") {
    note("could not load the MQTT library from unpkg.com.", true);
    return;
  }
  connect();
})();
</script>
</body>
</html>
