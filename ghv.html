<!DOCTYPE html>
<meta charset="utf-8">
<title>view</title>
<script>
(async () => {
  const path = location.search.slice(1);
  const fail = (msg) => { document.documentElement.textContent = msg; };
  if (!path) return fail("Usage: ?user/repo@branch/path/file.html");
  const url = encodeURI("https://cdn.jsdelivr.net/gh/" + decodeURIComponent(path));
  const res = await fetch(url);
  if (!res.ok) return fail("Could not load " + url + " (HTTP " + res.status + ")");
  let html = await res.text();
  const base = '<base href="' + url.slice(0, url.lastIndexOf("/") + 1) + '">';
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + base) : base + html;
  document.open();
  document.write(html);
  document.close();
})();
</script>
