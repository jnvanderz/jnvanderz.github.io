<!DOCTYPE html>
<meta charset="utf-8">
<title>ghv</title>
<script>
const DEFAULT_USER = "jnvanderz";
const DEFAULT_BRANCH = "main";
(async () => {
  const path = location.search.slice(1);
  const fail = (msg) => { document.documentElement.textContent = msg; };
  const usage = "Usage: ?/path/file.html  or  ?repo/path/file.html  or  ?user/repo@branch/path/file.html";
  if (!path) return fail(usage);
  let target = decodeURIComponent(path);
  if (!target.includes("@")) {
    const slash = target.indexOf("/");
    if (slash < 0) return fail(usage);
    const repo = slash === 0 ? DEFAULT_USER : target.slice(0, slash);
    target = DEFAULT_USER + "/" + repo + "@" + DEFAULT_BRANCH + target.slice(slash);
  }
  const url = encodeURI("https://cdn.jsdelivr.net/gh/" + target);
  const res = await fetch(url);
  if (!res.ok) return fail("Could not load " + url + " (HTTP " + res.status + ")");
  let html = await res.text();
  const base = '<base href="' + url.slice(0, url.lastIndexOf("/") + 1) + '">';
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + base) : base + html;
  document.open();
  document.write(html);
  document.close();
})();
</script>
