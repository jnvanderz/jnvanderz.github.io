<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base67 Converter.</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6860;
    --line: #d9d6ce;
    --accent: #0b6e4f;
    --accent-ink: #ffffff;
    --error: #b3261e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --panel: #1f1f1c;
      --ink: #ecebe6;
      --muted: #9a978e;
      --line: #36352f;
      --accent: #4cc29a;
      --accent-ink: #0c1a14;
      --error: #f2857d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; }
  .sub code { font-family: var(--mono); font-size: .85em; }

  .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem; }
  .tabs button {
    font: inherit; font-weight: 600; color: var(--muted);
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: .6rem 1rem; margin-bottom: -1px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  [hidden] { display: none !important; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem; margin-bottom: 1rem;
  }
  .panel.drag { border-color: var(--accent); outline: 2px dashed var(--accent); outline-offset: -6px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .5rem; }
  .head h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; margin: 0; color: var(--muted); }
  .meta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; text-align: right; }

  textarea, pre, input[type="text"] {
    width: 100%; font-family: var(--mono); font-size: .9rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .6rem .7rem;
  }
  textarea { height: 9rem; resize: vertical; word-break: break-all; }
  pre { margin: 0; max-height: 14rem; overflow: auto; white-space: pre; }
  pre.wrap { white-space: pre-wrap; word-break: break-word; }
  textarea:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; }
  .row .grow { flex: 1 1 12rem; }
  button.btn, label.btn {
    font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
    padding: .45rem .9rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chip {
    display: inline-flex; align-items: center; gap: .5rem; font-size: .85rem;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .3rem .2rem .75rem;
  }
  .chip button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 .4rem; }
  .hint { color: var(--muted); font-size: .85rem; }
  .error { color: var(--error); font-size: .9rem; margin: .6rem 0 0; min-height: 1.35rem; }
  .sublabel { font-size: .8rem; color: var(--muted); margin: .8rem 0 .3rem; }
  #fatal { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Base67 Converter.</h1>
  <p class="sub">Text and binary files to Base67 and back. Everything runs in your browser.</p>
  <p id="fatal" hidden></p>

  <div class="tabs" role="tablist">
    <button id="tab-encode" role="tab" aria-selected="true" aria-controls="view-encode">Encode</button>
    <button id="tab-decode" role="tab" aria-selected="false" aria-controls="view-decode">Decode</button>
  </div>

  <!-- ===================== ENCODE ===================== -->
  <section id="view-encode" role="tabpanel" aria-labelledby="tab-encode">
    <div class="panel" id="enc-drop">
      <div class="head"><h2>Input: text or file</h2><span class="meta" id="enc-in-meta"></span></div>
      <textarea id="enc-text" spellcheck="false" placeholder="Type or paste text here, or drop any file on this box"></textarea>
      <div class="row">
        <label class="btn">Choose file<input type="file" id="enc-file"></label>
        <span class="chip" id="enc-chip" hidden><span id="enc-chip-name"></span><button id="enc-chip-clear" title="Remove file" aria-label="Remove file">&#x2715;</button></span>
        <span class="hint" id="enc-hint">Text is encoded as UTF-8.</span>
      </div>
    </div>

    <div class="panel">
      <div class="head"><h2>Base67</h2><span class="meta" id="enc-out-meta"></span></div>
      <textarea id="enc-out" readonly spellcheck="false"></textarea>
      <div class="row">
        <button class="btn primary" id="enc-copy" disabled>Copy</button>
        <button class="btn" id="enc-download" disabled>Download .b67</button>
        <button class="btn" id="enc-send" disabled>Send to Decode</button>
        <span class="hint" id="enc-note"></span>
      </div>
      <p class="error" id="enc-error" role="alert"></p>
    </div>
  </section>

  <!-- ===================== DECODE ===================== -->
  <section id="view-decode" role="tabpanel" aria-labelledby="tab-decode" hidden>
    <div class="panel" id="dec-drop">
      <div class="head"><h2>Input: Base67</h2><span class="meta" id="dec-in-meta"></span></div>
      <textarea id="dec-text" spellcheck="false" placeholder="Paste Base67 here, or drop a .b67 file on this box"></textarea>
      <div class="row">
        <label class="btn">Load .b67 file<input type="file" id="dec-file"></label>
        <span class="chip" id="dec-chip" hidden><span id="dec-chip-name"></span><button id="dec-chip-clear" title="Remove file" aria-label="Remove file">&#x2715;</button></span>
        <span class="hint">Spaces and line breaks are ignored.</span>
      </div>
      <p class="error" id="dec-error" role="alert"></p>
    </div>

    <div class="panel">
      <div class="head"><h2>Decoded bytes</h2><span class="meta" id="dec-out-meta"></span></div>

      <div class="sublabel" id="dec-text-label">As text (UTF-8)</div>
      <pre class="wrap" id="dec-as-text"></pre>

      <div class="sublabel" id="dec-hex-label">Hex</div>
      <pre id="dec-as-hex"></pre>

      <div class="row">
        <input type="text" class="grow" id="dec-name" value="decoded.bin" aria-label="File name for download" spellcheck="false">
        <button class="btn primary" id="dec-download" disabled>Download file</button>
        <button class="btn" id="dec-copy" disabled>Copy text</button>
      </div>
    </div>
  </section>
</main>

<script type="module">
const LIB_URL = "https://cdn.jsdelivr.net/gh/jnvanderz/base67@main/releases/js/100/pbase67_102.js";

// Longest strings shown in the page; full data is always kept in memory.
const MAX_SHOWN_CHARS = 200000;
const MAX_HEX_BYTES = 512;

const $ = (id) => document.getElementById(id);

let Base67;
try {
  Base67 = await import(LIB_URL);
} catch (err) {
  $("fatal").hidden = false;
  $("fatal").textContent = "Could not load the Base67 library from " + LIB_URL + " (" + err.message + ")";
  throw err;
}

// ---------------------------------------------------------------- helpers

function formatBytes(n) {
  if (n < 1024) return n + (n === 1 ? " byte" : " bytes");
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB (" + n.toLocaleString() + " bytes)";
  return (n / 1024 / 1024).toFixed(2) + " MB (" + n.toLocaleString() + " bytes)";
}

function downloadBlob(parts, name, type) {
  const url = URL.createObjectURL(new Blob(parts, { type }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyText(text, button) {
  const original = button.textContent;
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = "Copied";
  } catch {
    button.textContent = "Copy failed";
  }
  setTimeout(() => { button.textContent = original; }, 1200);
}

function hexDump(bytes, limit) {
  const n = Math.min(bytes.length, limit);
  const lines = [];
  for (let off = 0; off < n; off += 16) {
    const row = bytes.subarray(off, Math.min(off + 16, n));
    let hex = "";
    let ascii = "";
    for (let i = 0; i < 16; i++) {
      if (i < row.length) {
        hex += row[i].toString(16).padStart(2, "0").toUpperCase() + " ";
        ascii += row[i] >= 0x20 && row[i] < 0x7F ? String.fromCharCode(row[i]) : ".";
      } else {
        hex += "   ";
      }
      if (i === 7) hex += " ";
    }
    lines.push(off.toString(16).padStart(8, "0").toUpperCase() + "  " + hex + " " + ascii);
  }
  if (bytes.length > n) lines.push("... " + (bytes.length - n).toLocaleString() + " more bytes");
  return lines.join("\n");
}

/** Returns the string if bytes are valid UTF-8 without control characters, else null. */
function tryUtf8(bytes) {
  try {
    const s = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
    return /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(s) ? null : s;
  } catch {
    return null;
  }
}

function setupDrop(panel, onFile) {
  panel.addEventListener("dragover", (e) => { e.preventDefault(); panel.classList.add("drag"); });
  panel.addEventListener("dragleave", () => panel.classList.remove("drag"));
  panel.addEventListener("drop", (e) => {
    e.preventDefault();
    panel.classList.remove("drag");
    const file = e.dataTransfer.files[0];
    if (file) onFile(file);
  });
}

// ---------------------------------------------------------------- tabs

function showTab(name) {
  for (const t of ["encode", "decode"]) {
    $("tab-" + t).setAttribute("aria-selected", String(t === name));
    $("view-" + t).hidden = t !== name;
  }
}
$("tab-encode").addEventListener("click", () => showTab("encode"));
$("tab-decode").addEventListener("click", () => showTab("decode"));

// ---------------------------------------------------------------- encode

const enc = { file: null, fileBytes: null, output: "" };

function renderEncode() {
  $("enc-error").textContent = "";
  let bytes;
  if (enc.fileBytes) {
    bytes = enc.fileBytes;
  } else {
    bytes = new TextEncoder().encode($("enc-text").value);
  }

  try {
    enc.output = Base67.encode(bytes);
  } catch (err) {
    enc.output = "";
    $("enc-error").textContent = err.message;
  }

  const shown = enc.output.length > MAX_SHOWN_CHARS;
  $("enc-out").value = shown ? enc.output.slice(0, MAX_SHOWN_CHARS) : enc.output;
  $("enc-note").textContent = shown
    ? "Showing the first " + MAX_SHOWN_CHARS.toLocaleString() + " symbols. Copy and Download use the full output."
    : "";
  $("enc-in-meta").textContent = formatBytes(bytes.length);
  $("enc-out-meta").textContent = enc.output.length.toLocaleString() + " symbols";

  const empty = enc.output.length === 0;
  $("enc-copy").disabled = empty;
  $("enc-download").disabled = empty;
  $("enc-send").disabled = empty;
}

async function setEncodeFile(file) {
  enc.file = file;
  enc.fileBytes = new Uint8Array(await file.arrayBuffer());
  $("enc-text").value = "";
  $("enc-text").disabled = true;
  $("enc-text").placeholder = "Encoding the file \"" + file.name + "\". Remove it to type text again.";
  $("enc-chip-name").textContent = file.name;
  $("enc-chip").hidden = false;
  $("enc-hint").hidden = true;
  renderEncode();
}

function clearEncodeFile() {
  enc.file = null;
  enc.fileBytes = null;
  $("enc-file").value = "";
  $("enc-text").disabled = false;
  $("enc-text").placeholder = "Type or paste text here, or drop any file on this box";
  $("enc-chip").hidden = true;
  $("enc-hint").hidden = false;
  renderEncode();
}

$("enc-text").addEventListener("input", renderEncode);
$("enc-file").addEventListener("change", (e) => { if (e.target.files[0]) setEncodeFile(e.target.files[0]); });
$("enc-chip-clear").addEventListener("click", clearEncodeFile);
setupDrop($("enc-drop"), setEncodeFile);

$("enc-copy").addEventListener("click", () => copyText(enc.output, $("enc-copy")));
$("enc-download").addEventListener("click", () => {
  const base = enc.file ? enc.file.name : "text.txt";
  downloadBlob([enc.output], base + ".b67", "text/plain");
});
$("enc-send").addEventListener("click", () => {
  setDecodeInput(enc.output, enc.file ? enc.file.name + ".b67" : null);
  showTab("decode");
});

// ---------------------------------------------------------------- decode

// `full` holds the complete Base67 input when it is too long for the textarea.
const dec = { full: null, sourceName: null, bytes: null, text: null };

function renderDecode() {
  const raw = dec.full !== null ? dec.full : $("dec-text").value;
  const clean = raw.replace(/\s+/g, "");

  $("dec-error").textContent = "";
  $("dec-in-meta").textContent = clean.length.toLocaleString() + " symbols";
  dec.bytes = null;
  dec.text = null;

  if (clean.length > 0) {
    try {
      dec.bytes = Base67.decode(clean);
    } catch (err) {
      $("dec-error").textContent = err.message;
    }
  }

  const ok = dec.bytes !== null;
  $("dec-download").disabled = !ok;
  $("dec-out-meta").textContent = ok ? formatBytes(dec.bytes.length) : "";

  if (!ok) {
    $("dec-as-text").textContent = "";
    $("dec-as-hex").textContent = "";
    $("dec-text-label").textContent = "As text (UTF-8)";
    $("dec-copy").disabled = true;
    return;
  }

  dec.text = tryUtf8(dec.bytes);
  if (dec.text === null) {
    $("dec-text-label").textContent = "As text (UTF-8): not text, this looks like binary data";
    $("dec-as-text").textContent = "";
  } else {
    const cut = dec.text.length > MAX_SHOWN_CHARS;
    $("dec-text-label").textContent = cut
      ? "As text (UTF-8), first " + MAX_SHOWN_CHARS.toLocaleString() + " characters"
      : "As text (UTF-8)";
    $("dec-as-text").textContent = cut ? dec.text.slice(0, MAX_SHOWN_CHARS) : dec.text;
  }
  $("dec-copy").disabled = dec.text === null;

  $("dec-hex-label").textContent = dec.bytes.length > MAX_HEX_BYTES
    ? "Hex, first " + MAX_HEX_BYTES + " bytes"
    : "Hex";
  $("dec-as-hex").textContent = hexDump(dec.bytes, MAX_HEX_BYTES);
}

/** Suggests the output name: "photo.png.b67" -> "photo.png". */
function suggestName(sourceName) {
  if (!sourceName) return "decoded.bin";
  const stripped = sourceName.replace(/\.b67(\.txt)?$/i, "");
  return stripped !== sourceName && stripped.length > 0 ? stripped : sourceName + ".bin";
}

function setDecodeInput(text, sourceName) {
  dec.sourceName = sourceName;
  if (text.length > MAX_SHOWN_CHARS) {
    dec.full = text;
    $("dec-text").value = "";
    $("dec-text").disabled = true;
    $("dec-text").placeholder = "Input loaded (" + text.length.toLocaleString() + " characters, too long to show). Remove it to paste again.";
  } else {
    dec.full = null;
    $("dec-text").disabled = false;
    $("dec-text").value = text;
  }
  $("dec-chip").hidden = !(sourceName || dec.full !== null);
  $("dec-chip-name").textContent = sourceName || "Loaded input";
  $("dec-name").value = suggestName(sourceName);
  renderDecode();
}

function clearDecodeInput() {
  dec.full = null;
  dec.sourceName = null;
  $("dec-file").value = "";
  $("dec-text").disabled = false;
  $("dec-text").value = "";
  $("dec-text").placeholder = "Paste Base67 here, or drop a .b67 file on this box";
  $("dec-chip").hidden = true;
  $("dec-name").value = "decoded.bin";
  renderDecode();
}

async function loadDecodeFile(file) {
  setDecodeInput(await file.text(), file.name);
}

$("dec-text").addEventListener("input", renderDecode);
$("dec-file").addEventListener("change", (e) => { if (e.target.files[0]) loadDecodeFile(e.target.files[0]); });
$("dec-chip-clear").addEventListener("click", clearDecodeInput);
setupDrop($("dec-drop"), loadDecodeFile);

$("dec-download").addEventListener("click", () => {
  if (!dec.bytes) return;
  const name = $("dec-name").value.trim() || "decoded.bin";
  downloadBlob([dec.bytes], name, "application/octet-stream");
});
$("dec-copy").addEventListener("click", () => {
  if (dec.text !== null) copyText(dec.text, $("dec-copy"));
});

// ---------------------------------------------------------------- start

renderEncode();
renderDecode();
</script>
</body>
</html>
